<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="text-scale" content="scale" />
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'none'" />

    <!-- Tailwind -->

    <!-- Custom CSS (correct path for /pages) -->
    <script src="../scripts/theme.js"></script>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/theme-dark.css">
    <script src="../scripts/alert-modal.js"></script>

    <!-- Fonts -->
    <link rel="stylesheet" href="../styles/tailwind.css">
    <link rel="stylesheet" href="../styles/ui.css">
    <script src="../scripts/ui-kit.js"></script>
</head>

<body class="auth-body min-h-screen">

    <!-- PAGE CONTENT -->
    <div id="forgot-password-screen" class="relative min-h-screen w-full flex items-center justify-center overflow-hidden">

        <!-- Background image -->
        <img
            src="https://api.builder.io/api/v1/image/assets/TEMP/a1ef3d09429c4b2a9a729acef3e490d3cfd0c7d5?width=3072"
            alt="Background"
            class="absolute inset-0 w-full h-full object-cover"
        >
        <div class="login-bg-dim" aria-hidden="true"></div>

        <!-- Card -->
        <div class="relative z-10 w-full max-w-md mx-4">
            <div class="heigen-gradient rounded-2xl shadow-2xl p-8 sm:p-10">
                    <div class="flex justify-center mb-8">
                        <img src="https://api.builder.io/api/v1/image/assets/TEMP/de54f4d2deecf022c8231c8fc79cb6aaefa92c17?width=444" 
                             alt="Heigen Logo" class="h-16 sm:h-20 w-auto">
                    </div>

                    <div class="text-center mb-8">
                        <h1 class="text-white text-2xl font-bold mb-2">Sign Up</h1>
                        <p class="text-white text-sm font-semibold">Create your Heigen account.</p>
                    </div>

                    <form id="signup-form" class="space-y-5">
                        <div>
                            <label for="signup-name" class="block text-white text-sm font-semibold mb-1">Name</label>
                            <input type="text" id="signup-name" data-error="signup-name-error" autocomplete="name" required
                                   class="w-full h-11 px-4 rounded-md text-gray-800 text-sm"
                                   placeholder="Enter your name">
                            <p id="signup-name-error" class="hg-error-msg"><span role="img" aria-label="Error">⚠</span> Enter your name.</p>
                        </div>

                        <div>
                            <label for="signup-email" class="block text-white text-sm font-semibold mb-1">E-mail</label>
                            <span id="signup-email-hint" class="hg-field-hint">Format: you@example.com</span>
                            <input type="email" id="signup-email" aria-describedby="signup-email-hint" data-error="signup-email-error" autocomplete="username" spellcheck="false" required
                                   class="w-full h-11 px-4 rounded-md text-gray-800 text-sm"
                                   placeholder="Enter your email">
                            <p id="signup-email-error" class="hg-error-msg"><span role="img" aria-label="Error">⚠</span> Enter an email address in the format you@example.com.</p>
                        </div>

                        <div>
                            <label for="signup-password" class="block text-white text-sm font-semibold mb-1">Password</label>
                            <input type="password" id="signup-password" data-error="signup-password-error" autocomplete="new-password" required
                                   class="w-full h-11 px-4 rounded-md text-gray-800 text-sm"
                                   placeholder="Enter your password">
                            <p id="signup-password-error" class="hg-error-msg"><span role="img" aria-label="Error">⚠</span> Enter a password.</p>
                        </div>

                        <div>
                            <label for="signup-confirm" class="block text-white text-sm font-semibold mb-1">Re-enter Password</label>
                            <input type="password" id="signup-confirm" data-error="signup-confirm-error" autocomplete="new-password" required
                                   class="w-full h-11 px-4 rounded-md text-gray-800 text-sm"
                                   placeholder="Re-enter your password">
                            <p id="signup-confirm-error" class="hg-error-msg"><span role="img" aria-label="Error">⚠</span> Re-enter your password.</p>
                        </div>

                        <button type="submit" class="btn-primary w-full h-10 rounded-md text-white text-base font-bold">
                            Create
                        </button>

                        <div class="flex items-center justify-center pt-2">
                            <button type="button" onclick="navigateTo('../index.html')" 
                                    class="link-button text-white text-sm font-bold">
                                Sign in
                            </button>
                        </div>
                    </form>
                </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../scripts/heigen-api.js"></script>
    <script src="../scripts/heigen-app.js"></script>
</body>
</html>
