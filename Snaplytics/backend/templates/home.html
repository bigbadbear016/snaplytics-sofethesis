<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snaplytics</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 92, 255, .22), transparent 32rem),
                radial-gradient(circle at 80% 80%, rgba(79, 209, 197, .12), transparent 28rem),
                #090a12;
            color: #f7f7fb;
        }
        main {
            width: min(680px, calc(100% - 40px));
            padding: 52px;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 24px;
            background: rgba(18, 19, 32, .78);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
            backdrop-filter: blur(18px);
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 18px;
            color: #a7ecc7;
            font-size: 13px;
            font-weight: 750;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .status::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #57d68d;
            box-shadow: 0 0 18px rgba(87, 214, 141, .9);
        }
        h1 { margin: 0 0 12px; font-size: clamp(42px, 9vw, 72px); line-height: .95; }
        p { margin: 0; color: #aaaabd; font-size: 18px; line-height: 1.7; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
        a {
            display: inline-flex;
            align-items: center;
            min-height: 46px;
            padding: 0 18px;
            border: 1px solid rgba(255, 255, 255, .11);
            border-radius: 12px;
            color: #fff;
            background: rgba(255, 255, 255, .055);
            text-decoration: none;
            font-weight: 700;
        }
        a.primary { border-color: #7c5cff; background: #7c5cff; }
        a:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    <main>
        <div class="status">System online</div>
        <h1>Snaplytics</h1>
        <p>Your Snaplytics backend is running and ready to receive requests.</p>
        <div class="actions">
            <a class="primary" href="/api/">Explore API</a>
            <a href="/admin/">Admin</a>
        </div>
    </main>
</body>
</html>
