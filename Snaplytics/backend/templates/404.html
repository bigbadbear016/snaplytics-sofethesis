<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found - Snaplytics</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(124, 92, 255, .18), transparent 32rem),
                #090a12;
            color: #f7f7fb;
            text-align: center;
        }
        main {
            width: min(600px, calc(100% - 40px));
            padding: 48px;
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 24px;
            background: rgba(18, 19, 32, .78);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .38);
        }
        .code { color: #9c87ff; font-size: 76px; line-height: 1; font-weight: 850; }
        h1 { margin: 20px 0 10px; font-size: 32px; }
        p { margin: 0; color: #aaaabd; line-height: 1.7; }
        a {
            display: inline-flex;
            align-items: center;
            min-height: 46px;
            margin-top: 28px;
            padding: 0 18px;
            border-radius: 12px;
            background: #7c5cff;
            color: #fff;
            text-decoration: none;
            font-weight: 750;
        }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>This page could not be found</h1>
        <p>The address may have moved or the link may be incorrect.</p>
        <a href="/">Back to Snaplytics</a>
    </main>
</body>
</html>
