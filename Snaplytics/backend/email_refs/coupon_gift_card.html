<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f3f6f8; padding: 32px 16px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #244855;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px; background-color: #ffffff; border: 1px solid #d9e2e6; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 12px rgba(36, 72, 85, 0.06);">

        <!-- Header -->
        <tr>
          <td style="background-color: #244855; padding: 24px 32px; text-align: center;">
            <span style="font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.6px; color: #ffffff;">HEIGEN STUDIO</span>
          </td>
        </tr>

        <tr>
          <td style="padding: 36px 32px 28px 32px; text-align: center;">
            <h1 style="margin: 0 0 8px 0; font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 700; color: $dark; line-height: 1.3;">$headline</h1>
            <p style="margin: 0 0 28px 0; font-size: 15px; line-height: 1.6; color: #527380;">$subline</p>

            <!-- Gift card -->
            <table role="presentation" align="center" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 440px; margin: 0 auto 28px auto;">
              <tr>
                <td bgcolor="$dark" style="background-color: $dark; background-image: linear-gradient(135deg, $dark 0%, $mid 100%); border-radius: 18px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28); padding: 26px 28px; text-align: left;">
                  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                    <tr>
                      <td style="font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #ffffff;">HEIGEN STUDIO</td>
                      <td align="right" style="font-size: 26px; line-height: 1;">$emoji</td>
                    </tr>
                    <tr>
                      <td colspan="2" style="padding-top: 28px;">
                        <div style="font-size: 11px; letter-spacing: 2px; color: #ffffff; opacity: 0.8;">GIFT CERTIFICATE</div>
                        <div style="font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 800; line-height: 1.05; color: #ffffff;">$discount</div>
                      </td>
                    </tr>
                    <tr>
                      <td colspan="2" style="padding-top: 22px;">
                        <div style="display: inline-block; background-color: #ffffff; border-radius: 8px; padding: 10px 16px;">
                          <div style="font-size: 10px; letter-spacing: 1.5px; color: #527380;">CODE</div>
                          <div style="font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: $dark;">{{code}}</div>
                        </div>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <p style="margin: 0 0 8px 0; font-size: 15px; line-height: 1.6; color: #365c6b;">Hi there! $body</p>

            <!-- CTA Button -->
            <table role="presentation" align="center" cellspacing="0" cellpadding="0" border="0" style="margin: 20px auto 8px auto;">
              <tr>
                <td bgcolor="$dark" style="background-color: $dark; border-radius: 8px;">
                  <a href="https://www.facebook.com/heigenstudio" target="_blank" rel="noopener noreferrer" style="display: inline-block; color: #ffffff; font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.4px; text-decoration: none; padding: 14px 32px;">$cta</a>
                </td>
              </tr>
            </table>
            <p style="margin: 0 0 4px 0; font-size: 12px; color: #6c8a96;">Show this email or code when you book.</p>
            $expiry

            <p style="margin: 24px 0 0 0; font-size: 14px; line-height: 1.6; color: #365c6b;">
              See you soon,<br />
              <strong style="font-family: 'Montserrat', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #244855;">The Heigen Studio Team</strong>
            </p>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color: #f4f8f9; padding: 16px 32px; text-align: center; border-top: 1px solid #d9e2e6;">
            <p style="margin: 0; font-size: 12px; color: #6c8a96;">© 2026 Heigen Studio. All rights reserved.</p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
